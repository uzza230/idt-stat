:root{--bg:#f7f2f2;--card:#fff;--ink:#22141a;--mute:#85737a;--line:#cdb9be;--acc:#d7263d;--onacc:#fff;--soft:#fbe4e8;--win:#14804a;--winbg:#dff5e8;--gold:#c98a00;--goldbg:#fff3d1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a0e;--card:#271319;--ink:#f6ecee;--mute:#ad9aa1;--line:#6a3b46;--acc:#ff4a5f;--onacc:#220a10;--soft:#3d1822;--win:#4fd08a;--winbg:#12301f;--gold:#f2b632;--goldbg:#3a2c0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150a0e;--card:#271319;--ink:#f6ecee;--mute:#ad9aa1;--line:#6a3b46;--acc:#ff4a5f;--onacc:#220a10;--soft:#3d1822;--win:#4fd08a;--winbg:#12301f;--gold:#f2b632;--goldbg:#3a2c0a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,"Noto Sans Thai","Sarabun",system-ui,sans-serif;font-synthesis:none;line-height:1.5}
main{max-width:1440px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:600;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 16px;font-size:15px}
a{color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn.ico{padding:8px;line-height:0;border-radius:50%;flex:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
.btn{display:inline-block;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:6px 14px;font-size:14px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:500}
.btn.pri:disabled{opacity:.6}
.btn.danger.arm{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.prog{font-size:14px;color:var(--mute)}
.msg{min-height:22px;font-size:14px;margin:0 0 12px;color:var(--mute)}
.msg.warn{color:var(--gold)}
.msg.err{color:var(--acc)}
.msg.ok{color:var(--win)}
#names{display:none;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
#names.on{display:block}
#names p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ng label{display:flex;align-items:center;gap:6px;font-size:13px}
.ng b{width:18px;color:var(--acc);font-weight:600}
.ng input{flex:1;min-width:0;font:inherit;font-size:14px;padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.podium{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.pod{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0}
.pod span{display:block;font-size:13px;color:var(--mute)}
.pod b{display:block;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.p1{background:var(--goldbg);border-color:var(--gold)}
.pod.p1 b{color:var(--gold);font-size:24px}
.scroll{overflow-x:auto;padding:8px 0 12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
#scaler{margin:0 auto}
.stage{display:flex;align-items:center;width:max-content;padding:12px 16px;transform-origin:0 0}
.tree{display:flex;align-items:center}
.node{display:flex;align-items:center}
.kids{display:flex;flex-direction:column;gap:12px;padding-right:20px}
.kids>.node{position:relative}
.kids>.node::after{content:"";position:absolute;right:-20px;top:50%;width:20px;border-top:2px solid var(--line)}
.kids>.node:first-child::before{content:"";position:absolute;right:-20px;top:50%;bottom:-6px;border-right:2px solid var(--line)}
.kids>.node:last-child::before{content:"";position:absolute;right:-20px;top:-6px;bottom:50%;border-right:2px solid var(--line)}
.hk>.match{margin-left:20px}
.hk>.match::before{content:"";position:absolute;left:-20px;top:50%;width:20px;border-top:2px solid var(--line)}
.right .node{flex-direction:row-reverse}
.right .kids{padding-right:0;padding-left:20px}
.right .kids>.node::after{right:auto;left:-20px}
.right .kids>.node:first-child::before,.right .kids>.node:last-child::before{right:auto;left:-20px;border-right:0;border-left:2px solid var(--line)}
.right .hk>.match{margin-left:0;margin-right:20px}
.right .hk>.match::before{left:auto;right:-20px}
.left>.node>.match::after{content:"";position:absolute;right:-24px;top:50%;width:24px;border-top:2px solid var(--line)}
.right>.node>.match::after{content:"";position:absolute;left:-24px;top:50%;width:24px;border-top:2px solid var(--line)}
.match{position:relative;width:152px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px}
.mh{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mute);padding:2px 8px;border-bottom:1px solid var(--line)}
.pl{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;text-align:left;background:transparent;border:0;padding:6px 8px;font-size:14px;font-weight:500;border-radius:0}
.pl+.pl{border-top:1px solid var(--line)}
.pl:last-child{border-radius:0 0 6px 6px}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.pl:not(:disabled):hover{background:var(--soft)}
.pl.win{background:var(--winbg);color:var(--win)}
.pl.win i{font-style:normal;font-weight:600}
.pl.lose{opacity:.45}
.pl.empty{color:var(--mute);font-weight:400;font-size:12px;cursor:default}
.center{margin:0 24px}
.fw{position:relative}
.trophy{position:absolute;bottom:calc(100% + 6px);left:0;right:0;text-align:center;font-size:34px;line-height:1}
.m16{width:176px;border-color:var(--gold);border-width:2px}
.m16 .pl{font-size:15px}
.third{position:absolute;top:calc(100% + 36px);left:12px}
.m15{border-style:dashed}
h2{font-size:18px;font-weight:600;margin:24px 0 8px}
table{width:100%;max-width:520px;border-collapse:collapse;background:var(--card);border:1.5px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left}
td:first-child,th:first-child{width:60px;text-align:center}
tr.g th{background:var(--soft);font-weight:600}
td.w{color:var(--win);font-weight:500}
.tip{font-size:13px;color:var(--mute);margin:8px 0 0}
.foot{margin-top:28px;font-size:13px;color:var(--mute)}
.login{max-width:360px;margin:40px auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:22px}
.login h1{font-size:22px}
.login label{display:block;font-size:14px;margin:12px 0 4px}
.login input{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.login .msg{margin:10px 0 0}
.login .btn{width:100%;margin-top:12px;padding:9px 14px}
@media (max-width:700px){.podium{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}
</style>
</head>
<body>
<main id="app"></main>
<script type="application/json" id="state">{"v":1,"names":["A","B","C","D","E","F","G","H","I","J","K","L","M","N","O","P"],"winners":{},"updated":null}</script>
<script id="app-script">
const L='ABCDEFGHIJKLMNOP';
const HASH='996fbd062d477b391ea0c94f7abd7467b808da7389e9e5a08f2a7279a2774bd3';
const HEAD='<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>สายการแข่งขัน Real Steel</title>';
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const st0=JSON.parse($('state').textContent);
const saved={names:st0.names,winners:st0.winners||{},updated:st0.updated||null};
let S={names:saved.names.slice(),winners:clone(saved.winners)};
let authed=false;
try{
  const d=JSON.parse(sessionStorage.getItem('rs-draft')||'null');
  if(d&&Array.isArray(d.names)&&d.names.length===16)S={names:d.names,winners:d.winners||{}};
  sessionStorage.removeItem('rs-draft');
  if(!location.hash&&sessionStorage.getItem('rs-go')){sessionStorage.removeItem('rs-go');location.hash='#admin'}
}catch(e){}
const isDirty=()=>JSON.stringify([S.names,S.winners])!==JSON.stringify([saved.names,saved.winners]);
const isAdm=()=>location.hash==='#admin';
const loggedIn=()=>{if(authed)return true;try{return sessionStorage.getItem('rs-admin')==='1'}catch(e){return false}};

/* ---- bracket logic ---- */
const KIDS={9:[1,2],10:[3,4],11:[5,6],12:[7,8],13:[9,10],14:[11,12]};
const SRC={};
for(let m=1;m<=8;m++)SRC[m]=[['p',2*m-2],['p',2*m-1]];
for(let m=9;m<=14;m++)SRC[m]=[['w',KIDS[m][0]],['w',KIDS[m][1]]];
SRC[15]=[['l',13],['l',14]];SRC[16]=[['w',13],['w',14]];
const ROUND=m=>m<=8?'รอบ 16 คน':m<=12?'รอบ 8 คน':m<=14?'รองชนะเลิศ':m==15?'ชิงอันดับ 3':'ชิงชนะเลิศ';
function part(m,s){return SRC[m].map(([t,x])=>{
  if(t=='p')return x;
  if(t=='w'){const w=s.winners[x];return w===undefined?null:w}
  const [a,b]=part(x,s),w=s.winners[x];
  if(w===undefined||a==null||b==null)return null;
  return w===a?b:a;});}
function sanitize(s){for(let m=1;m<=16;m++){const w=s.winners[m];if(w!==undefined&&!part(m,s).includes(w))delete s.winners[m]}}
function matchHTML(m,s,ro){
  const p=part(m,s),w=s.winners[m];
  const rows=p.map((x,k)=>{
    let cls='pl',txt;
    if(x==null){cls+=' empty';const [t,q]=SRC[m][k];txt=(t=='w'?'ผู้ชนะคู่ ':'ผู้แพ้คู่ ')+q}
    else{txt=s.names[x];if(w!==undefined)cls+=w===x?' win':' lose'}
    const inner=`<span class="nm">${esc(txt)}</span>${x!=null&&w===x?'<i>✓</i>':''}`;
    return ro?`<div class="${cls}" title="${esc(txt)}">${inner}</div>`
      :`<button class="${cls}" data-m="${m}" data-k="${k}" title="${esc(txt)}" ${x==null?'disabled':''}>${inner}</button>`}).join('');
  return `<div class="match m${m}"><div class="mh"><span>คู่ ${m}</span><span>${ROUND(m)}</span></div>${rows}</div>`;
}
function node(m,s,ro){const k=KIDS[m];
  return `<div class="node${k?' hk':''}">${k?`<div class="kids">${node(k[0],s,ro)}${node(k[1],s,ro)}</div>`:''}${matchHTML(m,s,ro)}</div>`}
const nm=(x,s)=>x==null?'–':esc(s.names[x]);

/* ---- drawing ---- */
function setMsg(t,k){const e=$('msg');if(e){e.textContent=t||'';e.className='msg'+(k?' '+k:'')}}
function dirtyMsg(){setMsg(isDirty()?'มีการเปลี่ยนแปลงที่ยังไม่ได้บันทึก ผู้ชมจะยังไม่เห็นจนกว่าจะกดบันทึกและเผยแพร่':'','warn')}
function draw(){
  const adm=isAdm(),s=adm?S:saved,ro=!adm;
  const [a,b]=part(16,s),[c,d]=part(15,s),f=s.winners[16],t=s.winners[15];
  const stage=$('bracket');stage.className='stage';
  stage.innerHTML=`<div class="tree left">${node(13,s,ro)}</div><div class="center"><div class="fw"><div class="trophy">🏆</div>${matchHTML(16,s,ro)}<div class="third">${matchHTML(15,s,ro)}</div></div></div><div class="tree right">${node(14,s,ro)}</div>`;
  const first=f===undefined?null:f,second=f===undefined?null:(f===a?b:a);
  const third=t===undefined?null:t,fourth=t===undefined?null:(t===c?d:c);
  $('podium').innerHTML=[['p1','🥇 อันดับ 1',first],['p2','🥈 อันดับ 2',second],['p3','🥉 อันดับ 3',third],['p4','อันดับ 4',fourth]]
    .map(([k,l,x])=>`<div class="pod ${k}"><span>${l}</span><b>${x==null?'–':esc(s.names[x])}</b></div>`).join('');
  $('prog').textContent='';
  const groups=[['รอบ 16 คน (8 คู่)',1,8],['รอบ 8 คน (4 คู่)',9,12],['รอบรองชนะเลิศ (2 คู่)',13,14],['ชิงอันดับ 3',15,15],['ชิงชนะเลิศ',16,16]];
  let h='<table><tr><th>ลำดับ</th><th>คู่ชก</th><th>ผู้ชนะ</th></tr>';
  for(const [g,lo,hi] of groups){
    h+=`<tr class="g"><th colspan="3">${g}</th></tr>`;
    for(let m=lo;m<=hi;m++){const [x,y]=part(m,s),w=s.winners[m];
      h+=`<tr><td>${m}</td><td>${nm(x,s)} vs ${nm(y,s)}</td><td class="w">${w===undefined?'–':nm(w,s)}</td></tr>`}
  }
  $('table').innerHTML=h+'</table>';fit();
  if(adm)dirtyMsg();
}
function updText(){
  if(!saved.updated)return 'ยังไม่มีการอัปเดตผลการแข่งขัน';
  try{return 'อัปเดตล่าสุด '+new Date(saved.updated).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}
}
function skeleton(adm){
  return `<div class="top"><h1>${adm?'จัดการสายการแข่งขัน Real Steel':'สายการแข่งขัน Real Steel'}</h1><button class="btn ico" id="themeBtn" aria-label="สลับโหมดสว่าง/มืด"></button></div>
<p class="sub"></p>
<div class="bar">${adm?'<button class="btn pri" id="saveBtn">บันทึกและเผยแพร่</button><button class="btn" id="editBtn">แก้ไขชื่อผู้เล่น</button><button class="btn danger" id="resetBtn">ล้างผลการแข่ง</button><a class="btn" href="#">ดูหน้าผู้ชม</a><button class="btn" id="outBtn">ออกจากระบบ</button>':''}<span class="grow"></span><span class="prog" id="prog"></span></div>
${adm?'<div class="msg" id="msg"></div><div id="names"><p>พิมพ์ชื่อใหม่ได้เลย (ค่าเริ่มต้น A–P) ผลที่เลือกไว้จะอยู่กับผู้เล่นคนเดิม</p><div class="ng" id="ng"></div><p style="margin:10px 0 0"><button class="btn" id="nameReset">คืนค่าชื่อเป็น A–P</button></p></div>':''}
<div class="podium" id="podium"${adm?' style="display:none"':''}></div>
<div class="scroll" id="fit"><div id="scaler"><div class="stage" id="bracket"></div></div></div>

<h2>ตารางผลการแข่งขัน</h2><div id="table"></div>
${adm?'':'<p class="foot"><a href="#admin">สำหรับผู้ดูแล</a></p>'}`;
}

/* ---- credentials ---- */
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function showLogin(){
  $('app').innerHTML=`<div class="login"><h1>เข้าสู่ระบบผู้ดูแล</h1><p class="sub">สำหรับกรอกผลการแข่งขัน</p><label for="u">ชื่อผู้ใช้</label><input id="u" autocomplete="username"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password"><div class="msg err" id="lmsg"></div><button class="btn pri" id="go">เข้าสู่ระบบ</button><p class="foot"><a href="#">กลับไปหน้าผู้ชม</a></p></div>`;
  const go=async()=>{
    const u=$('u').value.trim().toLowerCase(),p=$('p').value,m=$('lmsg');
    m.textContent='';
    try{
      if(await sha('rs-bracket|'+u+'|'+p)===HASH){authed=true;try{sessionStorage.setItem('rs-admin','1')}catch(e){}route();return}
      m.textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';$('p').value='';
    }catch(e){m.textContent='เบราว์เซอร์นี้ไม่รองรับการเข้าสู่ระบบ'}
  };
  $('go').onclick=go;
  for(const id of ['u','p'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('u').focus();
}

/* ---- publishing: the page rebuilds its own source with new data ---- */
function buildDoc(state){
  const css=$('app-style').textContent,js=$('app-script').textContent;
  const json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="th"><head>'+HEAD+'<style id="app-style">'+css+'</style></head><body><main id="app"></main><script type="application/json" id="state">'+json+'<\/script><script id="app-script">'+js+'<\/script></body></html>';
}
async function doSave(){
  const btn=$('saveBtn');btn.disabled=true;setMsg('กำลังบันทึก…');
  let art=null;
  try{art=window.claude&&await window.claude.use('artifact')}catch(e){}
  if(!art){setMsg('ในมุมมองนี้ยังบันทึกไม่ได้ ให้เปิดหน้านี้ผ่านลิงก์ของเจ้าของแล้วลองใหม่','err');btn.disabled=false;return}
  const next={v:1,names:S.names,winners:S.winners,updated:new Date().toISOString()};
  try{sessionStorage.setItem('rs-draft',JSON.stringify({names:S.names,winners:S.winners}));sessionStorage.setItem('rs-go','1')}catch(e){}
  try{
    await art.publish(buildDoc(next));
    setMsg('บันทึกแล้ว','ok');
  }catch(e){
    const c=e&&e.code;
    if(c==='conflict')return;
    try{sessionStorage.removeItem('rs-draft');sessionStorage.removeItem('rs-go')}catch(_){}
    setMsg(c==='not_writer'||c==='not_granted'?'บัญชีนี้ไม่มีสิทธิ์แก้ไขหน้านี้ การบันทึกทำได้เฉพาะเจ้าของหรือผู้แก้ไขของหน้า':c==='rate_limited'?'บันทึกถี่เกินไป รอสักครู่แล้วลองใหม่':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง','err');
    btn.disabled=false;
  }
}

/* ---- routing ---- */
function route(){
  const adm=isAdm();
  if(adm&&!loggedIn()){showLogin();return}
  $('app').innerHTML=skeleton(adm);
  themeIcon();$('themeBtn').onclick=()=>{
    const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme=dark?'light':'dark';themeIcon();
  };
  if(adm){
    const ng=$('ng');
    ng.innerHTML=S.names.map((n,i)=>`<label><b>${L[i]}</b><input maxlength="24" data-i="${i}" value="${esc(n)}"></label>`).join('');
    ng.addEventListener('input',e=>{const i=e.target.dataset.i;if(i==null)return;S.names[i]=e.target.value.trim()||L[i];draw()});
    $('editBtn').onclick=()=>$('names').classList.toggle('on');
    $('nameReset').onclick=()=>{S.names=[...L];ng.querySelectorAll('input').forEach((el,i)=>el.value=L[i]);draw()};
    $('bracket').addEventListener('click',e=>{
      const b=e.target.closest('button.pl');if(!b||b.disabled)return;
      const m=+b.dataset.m,x=part(m,S)[+b.dataset.k];
      if(x==null)return;
      if(S.winners[m]===x)delete S.winners[m];else S.winners[m]=x;
      sanitize(S);draw();
    });
    let timer;const rb=$('resetBtn');
    rb.onclick=()=>{
      if(rb.classList.contains('arm')){S.winners={};clearTimeout(timer);rb.classList.remove('arm');rb.textContent='ล้างผลการแข่ง';draw();return}
      rb.classList.add('arm');rb.textContent='กดอีกครั้งเพื่อยืนยัน';
      timer=setTimeout(()=>{rb.classList.remove('arm');rb.textContent='ล้างผลการแข่ง'},3000);
    };
    $('saveBtn').onclick=doSave;
    $('outBtn').onclick=()=>{
      authed=false;try{sessionStorage.removeItem('rs-admin')}catch(e){}
      if(location.hash)location.hash='';else route();
    };
  }
  draw();
}
const SUN='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeIcon(){
  const r=document.documentElement,b=$('themeBtn');if(!b)return;
  const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  b.innerHTML=dark?SUN:MOON;
}
const MINK=0.6;
function fit(){
  const box=$('fit'),sc=$('scaler'),st=$('bracket');
  if(!box||!sc||!st)return;
  st.style.transform='none';
  const w=st.offsetWidth,h=st.offsetHeight,avail=box.clientWidth;
  const k=Math.max(MINK,Math.min(1,avail/w));
  st.style.transform='scale('+k+')';
  sc.style.width=Math.ceil(w*k)+'px';sc.style.height=Math.ceil(h*k)+'px';
}
addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
addEventListener('hashchange',route);
route();
</script>
</body>
</html>
