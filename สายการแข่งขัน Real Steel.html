<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สายการแข่งขัน Real Steel</title>
<style id="app-style">
@font-face{font-family:"Sukhumvit Set";font-style:normal;font-weight:250;font-display:swap;src:url(fonts/SukhumvitSet-Thin.woff) format("woff")}
:root{--bg:#030a1c;--ink:#eaf2ff;--mute:#8fb4ff;--blue:#2f6fe0;--blue-d:#0a3fb8;--glow:rgba(47,111,224,.55);--card1:rgba(14,36,88,.9);--card2:rgba(5,14,40,.94);--light:#c6d9fc;--light-line:#93b3ee;--navy:#0b1a45;--gold:#ffc83d;--gold-d:#b8860b;--win:#0d6b3a;--winbg:#c4f3d6;--dot:#46d97b;--veil:rgba(2,8,26,.72);color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;color:var(--ink);font-family:"Sukhumvit Set","Noto Sans Thai","Sarabun",system-ui,sans-serif;font-synthesis:weight;line-height:1.5;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(70,130,255,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(70,130,255,.07) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(var(--veil),var(--veil)),url(bg.jpg) center/cover no-repeat,var(--bg)}
main{max-width:720px;margin:0 auto;padding:22px 16px 48px}
a{color:#9cc3ff;font-weight:600}
.top{display:flex;justify-content:center;margin:4px 0 10px}
.brand{display:flex;align-items:center;justify-content:center;text-align:center}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.2;background:linear-gradient(180deg,#fff,#a9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(70,130,255,.55))}
.eng{display:flex;align-items:center;justify-content:center;gap:10px;font-size:12px;letter-spacing:2.5px;color:#cfe0ff;font-weight:500}
.sub{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);margin:0 0 18px;font-size:14px;font-weight:600}
.sub::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px rgba(70,217,123,.25);flex:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
.btn{display:inline-block;background:rgba(10,32,84,.85);color:#fff;border:1px solid var(--blue);padding:6px 14px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 0 8px rgba(47,111,224,.45)}
.btn:hover{background:rgba(30,70,160,.92)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#ffe08a,var(--gold));color:#2a1d00;border-color:#ffe08a;box-shadow:0 0 10px rgba(255,200,61,.5);font-weight:800}
.btn.pri:disabled{opacity:.6}
.btn.danger.arm{background:#ff4a5f;border-color:#ff4a5f}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.prog{font-size:14px;color:var(--mute)}
.msg{min-height:22px;font-size:14px;font-weight:600;margin:0 0 12px;color:var(--mute)}
.msg.warn{color:var(--gold)}
.msg.err{color:#ff8d9a}
.msg.ok{color:var(--dot)}
#names{display:none;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--blue);box-shadow:0 0 12px var(--glow);padding:14px;margin-bottom:16px}
#names.on{display:block}
#names p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ng label{display:flex;align-items:center;gap:6px;font-size:13px}
.ng b{width:18px;color:var(--gold);font-weight:800}
.ng input,.login input{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--blue);background:var(--light);color:var(--navy);border-radius:0}
.ng input{flex:1;min-width:0}
.scroll{overflow:visible}
#scaler{margin:0 auto}
.vstage{padding:4px 0}
.rd{margin-bottom:24px}
.rd h3{display:flex;align-items:center;margin:0 0 12px;font-size:17px;font-weight:800;filter:drop-shadow(0 0 8px rgba(47,139,255,.6))}
.rd h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--blue),transparent)}
.rd h3 span,h2{display:inline-block;padding:6px 40px 6px 18px;background:linear-gradient(90deg,var(--blue-d),#2f8bff);color:#fff;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
h2{margin:30px 0 12px;font-size:17px;font-weight:800}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.match{position:relative;background:linear-gradient(180deg,var(--card1),var(--card2));color:var(--ink);border:1px solid var(--blue);box-shadow:0 0 12px var(--glow),inset 0 0 16px rgba(47,111,224,.22);padding-bottom:6px}
.mh{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;color:#fff;padding:7px 10px 5px}
.mh span:last-child{font-weight:600;color:#cfe0ff}
.pl{display:flex;align-items:center;justify-content:space-between;gap:6px;width:calc(100% - 12px);margin:0 6px;text-align:left;background:var(--light);color:var(--navy);border:0;border-radius:0;padding:6px 10px;font-size:14px;font-weight:700}
.pl+.pl{border-top:1px solid var(--light-line)}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.pl:not(:disabled):hover{background:#e0ecff}
.pl.win{background:var(--winbg);color:var(--win)}
.pl.win i{font-style:normal;font-weight:800}
.pl.lose{opacity:.55}
.pl.empty{color:#2c3f78;font-weight:500;font-size:13px;cursor:default}
.fglow{filter:drop-shadow(0 0 10px rgba(255,200,61,.5));max-width:660px;margin:0 auto}
.fbox{background:linear-gradient(90deg,var(--gold-d),#ffe08a 50%,var(--gold-d));clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);padding:2px}
.fbox .m16{clip-path:polygon(5% 0,95% 0,100% 50%,95% 100%,5% 100%,0 50%);background:linear-gradient(180deg,#0c2258,#040d28);border:0;box-shadow:none;display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;padding:14px 28px;min-height:92px}
.m16 .mh{display:none}
.m16::before{content:"";grid-column:2;grid-row:1;height:66px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffe9a0%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23ffc83d%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23b8860b%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M18%208h28v14c0%209-6%2016-14%2016s-14-7-14-16z%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M18%2012H8c0%209%204%2015%2011%2017M46%2012h10c0%209-4%2015-11%2017%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%2228%22%20y%3D%2238%22%20width%3D%228%22%20height%3D%2210%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Cpath%20d%3D%22M20%2048h24l3%208H17z%22%20fill%3D%22url%28%23g%29%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(255,200,61,.6))}
.m16 .pl:nth-child(2){grid-column:1;grid-row:1}
.m16 .pl:nth-child(3){grid-column:3;grid-row:1}
.m16 .pl{margin:0;width:100%;background:transparent;color:#fff;justify-content:center;text-align:center;font-size:17px;border:0}
.m16 button.pl:not(:disabled):hover{background:rgba(255,255,255,.1)}
.m16 .pl.win{background:transparent;color:var(--gold)}
.m16 .pl.lose{opacity:.4}
.m16 .pl.empty{color:#9db6e8;font-size:13px}
.third{max-width:280px;margin:22px auto 0}
.m15{border-style:dashed}
table{width:100%;border-collapse:separate;border-spacing:0;background:linear-gradient(180deg,var(--card1),var(--card2));color:var(--ink);border:1px solid var(--blue);box-shadow:0 0 12px var(--glow);font-size:14px}
th,td{padding:6px 10px;border-bottom:1px solid rgba(47,111,224,.35);text-align:left}
tr:last-child td{border-bottom:0}
td:first-child,th:first-child{width:60px;text-align:center}
tr:first-child th{background:#0d2a6e;color:#fff;font-weight:700}
tr.g th{background:linear-gradient(90deg,var(--blue-d),#2f8bff);color:#fff;font-weight:700;text-align:center}
td.w{color:#7ef0a8;font-weight:700}
.tip{font-size:13px;color:var(--mute);margin:8px 0 0}
.foot{margin-top:28px;font-size:13px;color:var(--mute)}
.login{max-width:360px;margin:40px auto;background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--blue);box-shadow:0 0 14px var(--glow);padding:22px}
.login h1{font-size:22px}
.login label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.login input{width:100%;padding:8px 10px}
.login .msg{margin:10px 0 0}
.login .btn{width:100%;margin-top:12px;padding:9px 14px}
@media (max-width:700px){h1{font-size:20px}.eng{font-size:10px;letter-spacing:1px;gap:6px}.rd h3{font-size:15px}.login h1{font-size:22px}.fbox .m16{padding:12px 20px;grid-template-columns:1fr 64px 1fr}.m16 .pl{font-size:15px}.m16::before{height:52px}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script id="app-script">
const L='ABCDEFGHIJKLMNOP';
const SB_URL='https://nfxpiwusfpkvdtsuvvaz.supabase.co';
const SB_KEY='sb_publishable_bnKRmt8SBYS-FKKTBWcaKw_PQpvWHHy';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
/* saved = what viewers see (from the database); S = the admin's working copy */
const saved={names:[...L],winners:{},updated:null};
let S={names:saved.names.slice(),winners:{}};
let isAdminUser=false,loaded=false,loadErr=false;
const isDirty=()=>JSON.stringify([S.names,S.winners])!==JSON.stringify([saved.names,saved.winners]);
const isAdm=()=>location.hash==='#admin';
const loggedIn=()=>isAdminUser;

/* ---- database ---- */
async function loadData(){
  const [p,m]=await Promise.all([
    sb.from('players').select('slot,name,updated_at').order('slot'),
    sb.from('matches').select('match_no,winner_slot,updated_at').order('match_no')
  ]);
  if(p.error||m.error)throw (p.error||m.error);
  const names=[...L],winners={};let upd=null;
  for(const r of p.data){names[r.slot]=r.name;if(!upd||r.updated_at>upd)upd=r.updated_at}
  for(const r of m.data){if(r.winner_slot!==null)winners[r.match_no]=r.winner_slot;if(!upd||r.updated_at>upd)upd=r.updated_at}
  const wasDirty=loaded&&isDirty();
  saved.names=names;saved.winners=winners;saved.updated=upd;
  if(!wasDirty)S={names:names.slice(),winners:clone(winners)};
  loaded=true;loadErr=false;
}
async function refresh(){
  try{await loadData();loadErr=false}catch(e){loadErr=true}
  if($('bracket'))draw();
}
let rtTimer;
function startLive(){
  const kick=()=>{clearTimeout(rtTimer);rtTimer=setTimeout(refresh,300)};
  sb.channel('bracket-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'players'},kick)
    .on('postgres_changes',{event:'*',schema:'public',table:'matches'},kick)
    .subscribe();
  setInterval(refresh,30000); /* fallback if realtime drops */
}
async function checkAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){isAdminUser=false;return}
  const {data,error}=await sb.from('admins').select('user_id').eq('user_id',session.user.id).maybeSingle();
  isAdminUser=!error&&!!data;
}

/* ---- bracket logic ---- */
const KIDS={9:[1,2],10:[3,4],11:[5,6],12:[7,8],13:[9,10],14:[11,12]};
const SRC={};
for(let m=1;m<=8;m++)SRC[m]=[['p',2*m-2],['p',2*m-1]];
for(let m=9;m<=14;m++)SRC[m]=[['w',KIDS[m][0]],['w',KIDS[m][1]]];
SRC[15]=[['l',13],['l',14]];SRC[16]=[['w',13],['w',14]];
const ROUND=m=>m<=8?'รอบ 16 คน':m<=12?'รอบ 8 คน':m<=14?'รองชนะเลิศ':m==15?'ชิงอันดับ 3':'ชิงชนะเลิศ';
function part(m,s){return SRC[m].map(([t,x])=>{
  if(t=='p')return x;
  if(t=='w'){const w=s.winners[x];return w===undefined?null:w}
  const [a,b]=part(x,s),w=s.winners[x];
  if(w===undefined||a==null||b==null)return null;
  return w===a?b:a;});}
function sanitize(s){for(let m=1;m<=16;m++){const w=s.winners[m];if(w!==undefined&&!part(m,s).includes(w))delete s.winners[m]}}
function matchHTML(m,s,ro){
  const p=part(m,s),w=s.winners[m];
  const rows=p.map((x,k)=>{
    let cls='pl',txt;
    if(x==null){cls+=' empty';const [t,q]=SRC[m][k];txt=(t=='w'?'ผู้ชนะคู่ ':'ผู้แพ้คู่ ')+q}
    else{txt=s.names[x];if(w!==undefined)cls+=w===x?' win':' lose'}
    const inner=`<span class="nm">${esc(txt)}</span>${x!=null&&w===x?'<i>✓</i>':''}`;
    return ro?`<div class="${cls}" title="${esc(txt)}">${inner}</div>`
      :`<button class="${cls}" data-m="${m}" data-k="${k}" title="${esc(txt)}" ${x==null?'disabled':''}>${inner}</button>`}).join('');
  return `<div class="match m${m}"><div class="mh"><span>คู่ที่ ${m}</span><span>${ROUND(m)}</span></div>${rows}</div>`;
}
function node(m,s,ro){const k=KIDS[m];
  return `<div class="node${k?' hk':''}">${k?`<div class="kids">${node(k[0],s,ro)}${node(k[1],s,ro)}</div>`:''}${matchHTML(m,s,ro)}</div>`}
const nm=(x,s)=>x==null?'–':esc(s.names[x]);

/* ---- drawing ---- */
function setMsg(t,k){const e=$('msg');if(e){e.textContent=t||'';e.className='msg'+(k?' '+k:'')}}
function dirtyMsg(){setMsg(isDirty()?'มีการเปลี่ยนแปลงที่ยังไม่ได้บันทึก ผู้ชมจะยังไม่เห็นจนกว่าจะกดบันทึกและเผยแพร่':'','warn')}
function draw(){
  const adm=isAdm(),s=adm?S:saved,ro=!adm;
  const stage=$('bracket');stage.className='vstage';
  const col=l=>`<div class="col">${l.map(m=>matchHTML(m,s,ro)).join('')}</div>`;
  const rd=(t,l,r)=>`<section class="rd"><h3><span>${t}</span></h3><div class="cols">${col(l)}${col(r)}</div></section>`;
  stage.innerHTML=rd('รอบ 16 คน',[1,2,3,4],[5,6,7,8])+rd('รอบ 8 คน',[9,10],[11,12])+rd('รอบรองชนะเลิศ',[13],[14])
    +`<section class="rd"><h3><span>ชิงชนะเลิศ</span></h3><div class="fglow"><div class="fbox">${matchHTML(16,s,ro)}</div></div><div class="third">${matchHTML(15,s,ro)}</div></section>`;
  $('prog').textContent='';
  const groups=[['ชิงชนะเลิศ',16,16],['ชิงอันดับ 3',15,15],['รอบรองชนะเลิศ (2 คู่)',13,14],['รอบ 8 คน (4 คู่)',9,12],['รอบ 16 คน (8 คู่)',1,8]];
  let h='<table><tr><th>ลำดับ</th><th>คู่ชก</th><th>ผู้ชนะ</th></tr>';
  for(const [g,lo,hi] of groups){
    h+=`<tr class="g"><th colspan="3">${g}</th></tr>`;
    for(let m=lo;m<=hi;m++){const [x,y]=part(m,s),w=s.winners[m];
      h+=`<tr><td>${m}</td><td>${nm(x,s)} vs ${nm(y,s)}</td><td class="w">${w===undefined?'–':nm(w,s)}</td></tr>`}
  }
  $('table').innerHTML=h+'</table>';fit();
  const sub=document.querySelector('#app .sub');
  if(sub)sub.textContent=loadErr?'โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้านี้อีกครั้ง':!loaded?'กำลังโหลดข้อมูล…':updText();
  if(adm)dirtyMsg();
}
function updText(){
  if(!saved.updated)return 'ยังไม่มีการอัปเดตผลการแข่งขัน';
  try{return 'อัปเดตล่าสุด '+new Date(saved.updated).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}
}
function skeleton(adm){
  return `<div class="top"><div class="brand"><div><h1>${adm?'จัดการสายการแข่งขัน Real Steel':'สายการแข่งขัน Real Steel'}</h1><div class="eng">IDT LEVEL UP MULTI GAME CHALLENGE</div></div></div></div>
<p class="sub"></p>
<div class="bar">${adm?'<button class="btn pri" id="saveBtn">บันทึกและเผยแพร่</button><button class="btn" id="editBtn">แก้ไขชื่อผู้เล่น</button><button class="btn danger" id="resetBtn">ล้างผลการแข่ง</button><a class="btn" href="#">ดูหน้าผู้ชม</a><button class="btn" id="outBtn">ออกจากระบบ</button>':''}<span class="grow"></span><span class="prog" id="prog"></span></div>
${adm?'<div class="msg" id="msg"></div><div id="names"><p>พิมพ์ชื่อใหม่ได้เลย (ค่าเริ่มต้น A–P) ผลที่เลือกไว้จะอยู่กับผู้เล่นคนเดิม</p><div class="ng" id="ng"></div><p style="margin:10px 0 0"><button class="btn" id="nameReset">คืนค่าชื่อเป็น A–P</button></p></div>':''}
<div class="scroll" id="fit"><div id="scaler"><div class="stage" id="bracket"></div></div></div>

<h2>ตารางผลการแข่งขัน</h2><div id="table"></div>`;
}

/* ---- admin login (Supabase Auth) ---- */
function showLogin(msg){
  $('app').innerHTML=`<div class="login"><h1>เข้าสู่ระบบผู้ดูแล</h1><p class="sub">สำหรับกรอกผลการแข่งขัน</p><label for="u">ชื่อผู้ใช้</label><input id="u" type="text" autocapitalize="none" autocorrect="off" autocomplete="username"><label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password"><div class="msg err" id="lmsg">${msg?esc(msg):''}</div><button class="btn pri" id="go">เข้าสู่ระบบ</button><p class="foot"><a href="#">กลับไปหน้าผู้ชม</a></p></div>`;
  const go=async()=>{
    let u=$('u').value.trim().toLowerCase();const p=$('p').value,m=$('lmsg'),b=$('go');
    if(u&&!u.includes('@'))u+='@idt-stat.local';
    m.textContent='';b.disabled=true;
    try{
      const {error}=await sb.auth.signInWithPassword({email:u,password:p});
      if(error){m.textContent='อีเมลหรือรหัสผ่านไม่ถูกต้อง';$('p').value='';b.disabled=false;return}
      await checkAdmin();
      if(!isAdminUser){await sb.auth.signOut();m.textContent='บัญชีนี้ไม่มีสิทธิ์เป็นผู้ดูแล';b.disabled=false;return}
      route();
    }catch(e){m.textContent='เข้าสู่ระบบไม่สำเร็จ ลองใหม่อีกครั้ง';b.disabled=false}
  };
  $('go').onclick=go;
  for(const id of ['u','p'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  $('u').focus();
}

/* ---- publishing: write to the database; viewers update live ---- */
async function doSave(){
  const btn=$('saveBtn');btn.disabled=true;setMsg('กำลังบันทึก…');
  const players=S.names.map((name,slot)=>({slot,name}));
  const matches=Array.from({length:16},(_,i)=>({match_no:i+1,winner_slot:S.winners[i+1]===undefined?null:S.winners[i+1]}));
  try{
    const a=await sb.from('players').upsert(players,{onConflict:'slot'});
    if(a.error)throw a.error;
    const b=await sb.from('matches').upsert(matches,{onConflict:'match_no'});
    if(b.error)throw b.error;
    await loadData();
    draw();
    setMsg('บันทึกแล้ว ผู้ชมจะเห็นผลล่าสุดทันที','ok');
  }catch(e){
    const denied=e&&(e.code==='42501'||/row-level security|permission/i.test(e.message||''));
    setMsg(denied?'บัญชีนี้ไม่มีสิทธิ์แก้ไข กรุณาเข้าสู่ระบบใหม่':'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง','err');
  }
  btn.disabled=false;
}

/* ---- routing ---- */
function route(){
  const adm=isAdm();
  if(adm&&!loggedIn()){showLogin();return}
  $('app').innerHTML=skeleton(adm);
  if(adm){
    const ng=$('ng');
    ng.innerHTML=S.names.map((n,i)=>`<label><b>${L[i]}</b><input maxlength="24" data-i="${i}" value="${esc(n)}"></label>`).join('');
    ng.addEventListener('input',e=>{const i=e.target.dataset.i;if(i==null)return;S.names[i]=e.target.value.trim()||L[i];draw()});
    $('editBtn').onclick=()=>$('names').classList.toggle('on');
    $('nameReset').onclick=()=>{S.names=[...L];ng.querySelectorAll('input').forEach((el,i)=>el.value=L[i]);draw()};
    $('bracket').addEventListener('click',e=>{
      const b=e.target.closest('button.pl');if(!b||b.disabled)return;
      const m=+b.dataset.m,x=part(m,S)[+b.dataset.k];
      if(x==null)return;
      if(S.winners[m]===x)delete S.winners[m];else S.winners[m]=x;
      sanitize(S);draw();
    });
    let timer;const rb=$('resetBtn');
    rb.onclick=()=>{
      if(rb.classList.contains('arm')){S.winners={};clearTimeout(timer);rb.classList.remove('arm');rb.textContent='ล้างผลการแข่ง';draw();return}
      rb.classList.add('arm');rb.textContent='กดอีกครั้งเพื่อยืนยัน';
      timer=setTimeout(()=>{rb.classList.remove('arm');rb.textContent='ล้างผลการแข่ง'},3000);
    };
    $('saveBtn').onclick=doSave;
    $('outBtn').onclick=async()=>{
      try{await sb.auth.signOut()}catch(e){}
      isAdminUser=false;S={names:saved.names.slice(),winners:clone(saved.winners)};
      if(location.hash)location.hash='';else route();
    };
  }
  draw();
}
function fit(){}
addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
addEventListener('hashchange',route);
(async()=>{
  route(); /* show the page shell right away */
  try{await checkAdmin()}catch(e){}
  await refresh();
  route();
  startLive();
})();
</script>
